<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مضيف GoldHEN لإصدارات PS4 من 5.05 إلى 14.02 هوبي</title>
<link rel="stylesheet" href="../style.css">
<style id="black-crown-theme">
html,body{margin:0!important;width:100%;height:100%;background:#080306 url('../black-crown-fast.jpg') center center / cover no-repeat fixed!important;color:white;font-family:Arial,Tahoma,sans-serif;text-align:center;overflow:hidden}
body>hr,body>br,body>p,body>a,body>h1:not(#msgs){display:none!important}
#msgs{position:fixed!important;z-index:30;left:18%;bottom:8%;width:64%;padding:10px 14px;box-sizing:border-box;margin:0!important;background:rgba(8,2,5,.8);border:1px solid #ab1d31;border-radius:10px;font-size:clamp(14px,2vw,24px)!important;line-height:1.5;display:none}
#bc-version{position:fixed;z-index:20;left:50%;top:55%;transform:translate(-50%,-50%);font:bold italic clamp(19px,3vw,38px) Arial,Tahoma,sans-serif;color:#fff;text-shadow:0 0 5px #fff,0 0 14px #e00020;direction:ltr;pointer-events:none;white-space:nowrap}
#bc-cache-ui{display:none;position:fixed;z-index:21;left:50%;top:64%;transform:translateX(-50%);width:72%;max-width:950px;direction:rtl;pointer-events:none;text-align:center}
#bc-cache-label{font-size:clamp(15px,2.1vw,25px);font-weight:bold;text-shadow:0 0 12px #ff243e}
#bc-track{display:none;position:relative;margin:14px auto 0;width:100%;height:24px;border:2px solid #e32942;border-radius:18px;box-sizing:border-box;overflow:hidden;background:rgba(18,3,8,.9);box-shadow:0 0 15px #b10022}
#bc-fill{height:100%;width:0;background:repeating-linear-gradient(115deg,#ff263f 0,#ff263f 22px,#a00017 23px,#a00017 32px);transition:width .12s linear}
#bc-percent{display:block;margin-top:9px;font:bold 22px Arial,sans-serif;direction:ltr;text-shadow:0 0 12px #ff0022}
body.bc-caching #bc-cache-ui,body.bc-caching #bc-track{display:block}
body.bc-error #msgs,body.bc-status #msgs{display:block}
@media(max-width:700px){#bc-version{top:55%;font-size:22px}#bc-cache-ui{top:63%;width:85%}}
</style></head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "لم يتم العثور على الملفات. امسح بيانات المتصفح ثم أعد تثبيت التخزين المؤقت.";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (
            (fwNum >= 11.50 && fwNum <= 12.02) ||
            (fwNum >= 12.50 && fwNum <= 13.00) ||
            (fwNum >= 13.02 && fwNum <= 13.52) ||
            fwNum == 14.00 || fwNum == 14.02
        ) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'إصدار النظام غير مدعوم: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum == 14.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/1402/jb2.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum == 14.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb2.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'إصدار النظام غير مدعوم: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    }
}
</script>

<hr>
<br>
<h1 id=msgs style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">جارٍ تحميل GoldHEN... يرجى الانتظار</h1>

<div id="bc-version"></div>
<div id="bc-cache-ui"><div id="bc-cache-label">جارٍ تحميل الكاش الخاص بالإصدار...</div><div id="bc-track"><div id="bc-fill"></div></div><div id="bc-percent">0%</div></div>
<script id="bc-dynamic-ui">(function(){
var ver=document.getElementById('bc-version'),ui=document.getElementById('bc-cache-ui'),fill=document.getElementById('bc-fill'),percent=document.getElementById('bc-percent'),msgs=document.getElementById('msgs');
var m=(navigator.userAgent||'').match(/PlayStation 4[ \/]([0-9]+(?:\.[0-9]+)?)/i);
ver.textContent=m?m[1]:'--.--';
function place(){var w=innerWidth,h=innerHeight,s=Math.max(w/1672,h/941),ox=(w-1672*s)/2,oy=(h-941*s)/2;ver.style.left=(ox+836*s)+'px';ver.style.top=(oy+525*s)+'px';ver.style.fontSize=Math.max(16,Math.min(43,37*s))+'px';}
place();window.addEventListener('resize',place,false);
var cachePage=/\/cache(?:505|700|900|css|slopkit)\.html$/i.test(location.pathname);
if(!cachePage){if(msgs){var old=msgs.innerHTML;var obs=new MutationObserver(function(){if(/غير مدعوم|تعذّر|لم يتم العثور|فشل|خطأ/.test(msgs.textContent))document.body.classList.add('bc-error');});obs.observe(msgs,{childList:true,subtree:true,characterData:true});}return;}
var ac=window.applicationCache,done=false;
function progress(n){if(done)return;document.body.classList.add('bc-caching');var p=Math.max(0,Math.min(100,Math.round(n)));fill.style.width=p+'%';percent.textContent=p+'%';}
function finish(){if(done)return;progress(100);done=true;setTimeout(function(){document.body.classList.remove('bc-caching');},650);}
function error(){document.body.classList.remove('bc-caching');document.body.classList.add('bc-error');}
progress(0);
if(ac){ac.addEventListener('progress',function(e){if(e.total>0)progress(e.loaded/e.total*100);},false);ac.addEventListener('cached',finish,false);ac.addEventListener('updateready',finish,false);ac.addEventListener('noupdate',function(){done=true;document.body.classList.remove('bc-caching');},false);ac.addEventListener('error',error,false);if(ac.status===ac.IDLE||ac.status===ac.UNCACHED&&navigator.onLine===false){document.body.classList.remove('bc-caching');}}
})();</script></body>
</html>
